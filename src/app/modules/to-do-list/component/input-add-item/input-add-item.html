<header [ngClass]="{
    'has-items': inputListItems.length}"
    class="container">
    @if(inputListItems.length){
    <h1>Minha Lista</h1>
    }


    <div [ngClass]="{'container': inputListItems.length}">
        <label for="inputValue" class="input-label-text"
        [ngClass]="{'remove-margin-bottom': !inputListItems.length}">
            <input type="text" (keyup.enter)="focusAndAddItem(inputText.value)" placeholder="Adicione um item" autofocus
                id="inputValue" autofocus #inputText>
            <button 
                class="btn btn-primary-circle" 
                title="Adicionar um novo item"
                (click)="focusAndAddItem(inputText.value)" 
                [ngClass]="{'remove-margin-bottom': !inputListItems.length}"></button>
        </label>
    </div>

</header>
